<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OmniChoir FX v0.5 — Interface Preview</title>
<style>
:root{color-scheme:dark;--gold:#e8ba67;--cream:#efe1cb;--muted:#a48f86;--ink:#09070e;--panel:#19131a;--edge:#5b4539}*{box-sizing:border-box}body{margin:0;background:#08060c;font-family:Arial,Helvetica,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;color:var(--cream)}.shell{width:810px;height:577px;max-width:100vw;background:linear-gradient(#301b17 0,#110b12 105px,#08060d 190px);border:1px solid #594139;box-shadow:0 25px 80px #0008;overflow:hidden;position:relative;display:flex;flex-direction:column}.top{height:49px;display:flex;align-items:center;padding:0 14px;gap:25px;border-bottom:1px solid #573d31}.brand{font-weight:800;font-size:27px;letter-spacing:1px;color:var(--gold)}.headline{font-weight:700;font-size:12px;letter-spacing:1px}.mainbuttons{height:41px;display:flex;align-items:center;gap:8px;padding:0 12px}button{cursor:pointer;border-radius:7px;border:1px solid #654a35;color:var(--cream);background:#422b1d;padding:0 13px;height:29px;font-size:11px;font-weight:700;letter-spacing:.5px}button.on{color:#2a1b12;background:linear-gradient(#ffe29f,#dea34e);box-shadow:0 2px 9px #d4974555;border-color:#e8c881}button:focus-visible{outline:2px solid white;outline-offset:2px}.hint{font-size:10px;opacity:.75;margin-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stage{position:relative;margin:1px 12px 0;flex:1;min-height:0;border-radius:14px;background:#160f16;border:1px solid #78533d;overflow:hidden}.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}.tabs{height:31px;display:grid;grid-template-columns:repeat(5,1fr);margin:5px 12px 0;gap:3px}.tabs button{height:27px;border-radius:4px;background:#30201c}.tabs button.active{background:var(--gold);color:#291707}.bottom{height:107px;display:flex;align-items:stretch;padding:2px 12px 0;gap:4px}.control{flex:1;min-width:0;height:96px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;font-weight:700;color:var(--muted)}.control input[type=range]{width:90%;height:52px;accent-color:var(--gold);writing-mode:vertical-lr;direction:rtl}.control strong{font-size:10px;color:#f1d099;font-weight:400}.control select{width:94%;margin-top:15px;background:#24181e;color:var(--cream);height:27px;border:1px solid var(--edge);font-size:10px}.footer{height:16px;color:var(--gold);font-size:10px;padding:0 14px}.footer span{float:right;opacity:.55;color:var(--cream)}.score{display:flex;width:100%;gap:7px}.score .column{min-width:125px;width:125px}.score .column button{width:100%;margin-bottom:4px}.score .line{font-size:10px;opacity:.8;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score .notelist{flex:1;border:1px solid var(--edge);overflow:auto;max-height:90px}.score .note{font-size:10px;white-space:nowrap;padding:5px 4px;cursor:pointer;border-bottom:1px solid #322423}.score .note.active{background:#67462b}.score .edit{width:110px;display:grid;grid-template-columns:1fr 1fr;gap:3px;align-content:start}.score .edit button{padding:0;font-size:10px;height:19px}.scaninfo{font-size:11px;color:var(--gold);font-weight:400}.stemflow{display:flex;align-items:flex-start;gap:8px;padding:8px;width:100%;flex-wrap:wrap}.stemflow .explain{color:var(--muted);font-size:11px;align-self:center;margin-left:5px}.notice{position:absolute;top:6px;right:12px;font-size:9px;opacity:.6;pointer-events:none}
</style></head><body><main class="shell">
<header class="top"><div class="brand">OMNICHOIR</div><div class="headline">LIVE CHOIRIFICATION &nbsp;/&nbsp; SCAN &amp; RENDER</div></header>
<div class="mainbuttons"><button id="live">SCAN LIVE INPUT</button><button id="power" class="on">CHOIR ON</button><div class="hint">INSERT ON A VOCAL TRACK · LIVE MODE = RESPONSIVE · SCAN TAB = FULL TAKE</div></div>
<div class="stage"><canvas id="stage" aria-label="Draggable singer groups, lead singer and microphone"></canvas><div class="notice">INTERACTIVE GUI PREVIEW · AUDIO ENGINE IN JUCE PLUGIN</div></div>
<nav class="tabs"><button data-tab="0" class="active">VOICE</button><button data-tab="1">SPACE</button><button data-tab="2">ROOM</button><button data-tab="3">SCAN / EDIT</button><button data-tab="4">STEMS</button></nav>
<section class="bottom" id="bottom"></section><footer class="footer">YOUR VOICE / A FULL CHOIR &nbsp;·&nbsp; 16 INDEPENDENT SINGER LAYERS <span>71% SIZE / RESIZABLE</span></footer>
</main><script>
'use strict';
// Visual translation of user's demo.js and updated omnichoir-demo.js drag
// model, lead / microphone distinction, section group movements and colors.
// Original DSP JavaScript preserved in ../Reference/, not executed here.
const canvas=document.querySelector('#stage'),ctx=canvas.getContext('2d');
const label=['SOPRANOS','ALTOS','TENORS','BASSES'],colors=['#d98e9f','#eed08a','#75c9ae','#8aaee2'];
const state={groups:[[-5.1,6],[-1.7,5.2],[1.7,5.2],[5.1,6]],mic:[0,0],lead:[-2.35,1.9],choir:true,active:-1};
const back=new Image();back.src='../Assets/cathedral_stage.jpg';
const score=[['0.1','C4','G4','E4','G3','C3'],['1.4','E4','B4','G4','B3','E3'],['2.6','G4','D5','B4','D4','G3']];
let dpr=1,points=[],currentTab=0,selected=0;
function projection(){const w=canvas.clientWidth,h=canvas.clientHeight;return {w,h,to:(x,y)=>[w*.5+x*w/21,h-27-(y+1.1)/14*(h-52)],from:(x,y)=>[(x-w*.5)*21/w,(h-27-y)*14/(h-52)-1.1]};}
function singer(x,y,r,col){ctx.save();ctx.translate(x,y);ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(0,r*.9,r*.67,r*.12,0,0,Math.PI*2);ctx.fill();const g=ctx.createLinearGradient(-r,-r,r,r);g.addColorStop(0,col);g.addColorStop(1,'#433337');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-r*.3,-r*.23);ctx.bezierCurveTo(-r*.56,-r*.1,-r*.55,r*.3,-r*.6,r*.83);ctx.quadraticCurveTo(0,r*.96,r*.6,r*.83);ctx.bezierCurveTo(r*.55,r*.3,r*.56,-r*.1,r*.3,-r*.23);ctx.fill();ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-r*.48,r*.26,r*.29,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff5';ctx.stroke();ctx.restore();}
function paint(){const {w,h,to}=projection();ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);if(back.complete&&back.naturalWidth){ctx.drawImage(back,0,0,w,h)}else{ctx.fillStyle='#1e151a';ctx.fillRect(0,0,w,h)}let grad=ctx.createLinearGradient(0,h*.1,0,h);grad.addColorStop(0,'#09060b00');grad.addColorStop(1,'#09060bea');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);ctx.font='bold 10px Arial';ctx.fillStyle='#d9a875';ctx.fillText('DRAG SINGERS / LEAD / MIC',18,22);ctx.textAlign='right';ctx.fillText('CATHEDRAL STAGE',w-18,22);ctx.textAlign='center';points=[];
 for(let s=0;s<4;s++){const [gx,gy]=state.groups[s];for(let row=2;row>=0;row--)for(let col=0;col<4;col++){const [x,y]=to(gx+(col-1.5)*.47+(row%2)*.12,gy+(row-1)*.53);singer(x,y,Math.max(11,h*.05),state.choir?colors[s]:'#57515b');}const [cx,cy]=to(gx,gy);ctx.fillStyle=state.choir?colors[s]:'#928487';ctx.fillText(label[s],cx,cy+27);points.push([cx,cy,s]);}
 const [lx,ly]=to(...state.lead);let halo=ctx.createRadialGradient(lx,ly,3,lx,ly,32);halo.addColorStop(0,'#ffebbe59');halo.addColorStop(1,'#fff0ba00');ctx.fillStyle=halo;ctx.fillRect(lx-35,ly-40,70,80);singer(lx,ly,21,'#f1ede3');ctx.fillStyle='#f5ebd8';ctx.fillText('LEAD',lx,ly+28);points.push([lx,ly,4]);
 const [mx,my]=to(...state.mic);ctx.fillStyle='#edbb6977';ctx.beginPath();ctx.ellipse(mx,my,21,18,0,0,7);ctx.fill();ctx.strokeStyle='#efbd6e';ctx.beginPath();ctx.ellipse(mx,my,18,15,0,0,7);ctx.stroke();ctx.fillStyle='#e8ba67';ctx.fillRect(mx-3,my-14,6,13);ctx.fillRect(mx-1,my,2,16);ctx.fillRect(mx-7,my+14,14,2);ctx.fillText('MIC',mx,my+30);points.push([mx,my,5]);ctx.textAlign='left';ctx.fillStyle='#c2a178';ctx.font='10px Arial';ctx.fillText('INPUT',19,h-25);ctx.fillStyle='#755435';ctx.fillRect(18,h-18,85,4);ctx.fillStyle='#e8ba67';ctx.fillRect(18,h-18,23,4);
}
function size(){const box=canvas.getBoundingClientRect();dpr=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(box.width*dpr);canvas.height=Math.round(box.height*dpr);paint();}window.addEventListener('resize',size);back.onload=paint;
let drag=null;function pos(e){const r=canvas.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}canvas.addEventListener('pointerdown',e=>{const [x,y]=pos(e);let dist=38,id=-1;for(const [cx,cy,ci] of points){const d=Math.hypot(x-cx,y-cy);if(d<dist){dist=d;id=ci}}if(id>=0){drag={id,pointer:e.pointerId,start:projection().from(x,y),place:id<4?state.groups[id].slice():id===4?state.lead.slice():state.mic.slice()};canvas.setPointerCapture(e.pointerId);canvas.style.cursor='grabbing';}});canvas.addEventListener('pointermove',e=>{if(!drag)return;const [x,y]=projection().from(...pos(e)),dx=x-drag.start[0],dy=y-drag.start[1],v=[Math.max(-9,Math.min(9,drag.place[0]+dx)),Math.max(-6,Math.min(12,drag.place[1]+dy))];if(drag.id<4)state.groups[drag.id]=v;else if(drag.id===4)state.lead=v;else state.mic=v;paint()});canvas.addEventListener('pointerup',()=>{drag=null;canvas.style.cursor='grab'});canvas.addEventListener('pointercancel',()=>{drag=null;canvas.style.cursor='grab'});
document.querySelector('#power').onclick=e=>{state.choir=!state.choir;e.currentTarget.classList.toggle('on',state.choir);e.currentTarget.textContent=state.choir?'CHOIR ON':'CHOIR OFF';paint()};document.querySelector('#live').onclick=e=>{e.currentTarget.textContent='SCAN IN DAW PLUGIN';setTimeout(()=>e.currentTarget.textContent='SCAN LIVE INPUT',1000)};
const pages=[['PROCESS|Live|choice','HARMONY|Major|choice','SOPRANO|0.83','ALTO|0.83','TENOR|0.83','BASS|0.83','ENSEMBLE|0.58','HUMANIZE|0.75','CHARACTER|0.50','MIX|0.78'],['LEAD LEVEL|1.0','MIC SPACING|0.6','MIC ARRAY|ORTF|choice','SENSITIVITY|0.65','SOPRANO|0.83','ALTO|0.83','TENOR|0.83','BASS|0.83'],['ROOM SIZE|0.52','REVERB TIME|2.4','ABSORPTION|0.4','DIFFUSION|0.7','ROOM RETURN|0.37','OUTPUT|0.9']];
const bottom=document.querySelector('#bottom');function tab(id){currentTab=id;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',+b.dataset.tab===id));bottom.innerHTML='';if(id<3){for(const item of pages[id]){const [name,val,type]=item.split('|');const el=document.createElement('div');el.className='control';if(type==='choice'){el.innerHTML=`<label>${name}</label><select><option>${val}</option>${name==='HARMONY'?'<option>Minor</option><option>Unison</option>':''}</select>`}else{el.innerHTML=`<label>${name}</label><input type="range" min="0" max="1" step="0.01" value="${Math.min(1,Number(val))}"><strong>${val}</strong>`;const s=el.querySelector('input');s.oninput=()=>el.querySelector('strong').textContent=Number(s.value).toFixed(2)}bottom.append(el)}}else if(id===3){bottom.innerHTML=`<div class="score"><div class="column"><button id="import">IMPORT FULL TAKE</button><button id="render">RENDER WAV</button><button id="midi">EXPORT MIDI</button></div><div class="notelist" id="notelist"></div><div class="edit" id="edit"></div></div>`;document.querySelector('#import').onclick=()=>alert('This is a visual preview. Import a WAV in the built VST3.');document.querySelector('#render').onclick=()=>alert('Offline WAV export runs inside the built VST3.');document.querySelector('#midi').onclick=()=>alert('Five-track MIDI export runs in the plugin, once built.');const list=document.querySelector('#notelist');const update=()=>{list.innerHTML=score.map((n,i)=>`<div class="note ${selected===i?'active':''}" data-i="${i}">${n[0]}s &nbsp; L:${n[1]} &nbsp; S:${n[2]} A:${n[3]} T:${n[4]} B:${n[5]}</div>`).join('');list.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>{selected=+el.dataset.i;update()})};update();document.querySelector('#edit').innerHTML=['S','A','T','B'].flatMap(c=>[`<button>${c}-</button>`,`<button>${c}+</button>`]).join('');}else{bottom.innerHTML=`<div class="stemflow"><button id="load">LOAD STEM JSON</button><button id="mix">MIX STEMS WAV</button><span class="explain">SCAN → EXPORT SATB MIDI → RECORD DIFFERENT VOICES → IMPORT STEM JSON → SPATIAL MIX<br>Requires aligned singer WAVs; no neural models bundled. Plugin stage positions apply.</span></div>`;document.querySelector('#load').onclick=()=>alert('Select a voice-stem JSON manifest in the built VST3.');document.querySelector('#mix').onclick=()=>alert('Spatial WAV render runs on the background worker in the built VST3.');}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(+b.dataset.tab));tab(0);size();
</script></body></html>
