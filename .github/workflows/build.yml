name: Build SkellyChoir Windows VST3
on:
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'tests/**'
      - 'Assets/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/ui-tour.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'tests/**'
      - 'Assets/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/ui-tour.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Run native DSP, room, state and UI-stub regressions
        run: bash scripts/run_tests.sh
      - name: Run Windows VST3 package-verifier regression tests
        run: python -m unittest discover -s tests -p test_release_package.py -v

  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The PR job checks out GitHub's synthetic merge commit, but CMake
          # derives SOURCE_DATE_EPOCH from SOURCE_COMMIT (the PR head SHA).
          # Fetch history so that exact head commit is available to git show.
          fetch-depth: 0
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Stage exact Windows VST3 bundle
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem -Path build -Directory -Recurse -Filter 'SkellyChoir.vst3')
          if ($bundles.Count -ne 1) { throw "Expected exactly one SkellyChoir.vst3 bundle; found $($bundles.Count)" }
          $package = Join-Path (Get-Location) 'package'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item -LiteralPath $bundles[0].FullName -Destination $package -Recurse
          $staged = Join-Path $package 'SkellyChoir.vst3'
          $modules = @(Get-ChildItem -Path $staged -Recurse -File -Filter '*.vst3')
          if ($modules.Count -ne 1) { throw "Expected exactly one VST3 module; found $($modules.Count)" }
          $forbidden = @(Get-ChildItem -Path $staged -Recurse -File | Where-Object { $_.Extension.ToLowerInvariant() -in @('.exe', '.zip') })
          if ($forbidden.Count -ne 0) { throw "Unexpected executable or nested archive in VST3 bundle" }
          Write-Host "Staged bundle: $staged"
      - name: Normalize metadata and verify Windows PE32+ bundle
        run: python scripts/verify_windows_vst3.py --bundle package/SkellyChoir.vst3
      - name: Validate exact staged VST3 with pluginval
        uses: Tracktion/pluginval/validate@v2.0.0-beta3
        with:
          plugins: package/SkellyChoir.vst3
          strictness-level: 5
          pluginval-version: v2.0.0-beta3
      - name: Stage private-preview installer and rights notices
        shell: pwsh
        run: |
          Copy-Item -LiteralPath scripts/Install-SkellyChoirPreview.ps1 -Destination package/
          Copy-Item -LiteralPath docs/WINDOWS-VST3-INSTALL.md -Destination package/
          Copy-Item -LiteralPath docs/THIRD_PARTY_NOTICES.md -Destination package/
      - name: Write release provenance after all validation gates
        shell: pwsh
        run: python scripts/verify_windows_vst3.py --bundle package/SkellyChoir.vst3 --manifest package/build-info.json --source-commit "$env:SOURCE_COMMIT" --ci-commit "$env:GITHUB_SHA" --run-id "$env:GITHUB_RUN_ID" --pluginval-passed
      - name: Test private-preview installer, update and rollback
        shell: pwsh
        run: |
          & package/Install-SkellyChoirPreview.ps1 -SelfTest
          $whatIfDestination = Join-Path $env:RUNNER_TEMP 'SkellyChoir-WhatIf-VST3'
          $whatIfBackup = Join-Path $env:RUNNER_TEMP 'SkellyChoir-WhatIf-Backups'
          & package/Install-SkellyChoirPreview.ps1 -PackageRoot package -Destination $whatIfDestination -BackupRoot $whatIfBackup -WhatIf
          if (Test-Path -LiteralPath $whatIfDestination) { throw 'WhatIf unexpectedly created the VST3 destination' }
          if (Test-Path -LiteralPath $whatIfBackup) { throw 'WhatIf unexpectedly created the backup directory' }
      - name: Confirm public repository preview artifact withholding
        if: ${{ github.repository_visibility == 'public' }}
        shell: pwsh
        run: |
          Write-Host "Public repository: VST3 package validation passed; installable preview artifact is intentionally withheld."
      - uses: actions/upload-artifact@v6
        if: ${{ github.repository_visibility == 'private' }}
        with:
          name: SkellyChoir-Windows-VST3
          path: package/
          retention-days: 14
          if-no-files-found: error
