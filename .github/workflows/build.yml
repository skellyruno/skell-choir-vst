name: Build SkellyChoir Windows VST3
on:
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'tests/**'
      - 'Assets/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'tests/**'
      - 'Assets/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Run native DSP, room, state and UI-stub regressions
        run: bash scripts/run_tests.sh

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Package
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Directory -Recurse -Filter '*.vst3' | Select-Object -First 1
          if (-not $plugin) { throw 'VST3 bundle missing' }
          Compress-Archive -Path $plugin.FullName -DestinationPath SkellyChoir-${{ runner.os }}-VST3.zip
      - uses: actions/upload-artifact@v6
        with:
          name: SkellyChoir-${{ runner.os }}-VST3
          path: SkellyChoir-${{ runner.os }}-VST3.zip
          if-no-files-found: error
