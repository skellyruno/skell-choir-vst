name: SkellyChoir / compact UI review
on:
  pull_request:
    paths:
      - 'Source/**'
      - 'tools/screenshots.cpp'
      - 'tests/test_ui_screenshots.py'
      - 'CMakeLists.txt'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/ui-tour.yml'
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tour:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Install real JUCE GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build xvfb xauth openbox x11-utils pkg-config libasound2-dev libjack-jackd2-dev \
            libfreetype6-dev libfontconfig1-dev libx11-dev libxext-dev \
            libxinerama-dev libxcursor-dev libxrandr-dev libxcomposite-dev \
            libxrender-dev libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libgtk-3-dev scrot
      - name: Configure SkellyChoir UI
        run: cmake -S . -B build-ui -G Ninja -DCMAKE_BUILD_TYPE=Release -DOMNICHOIR_BUILD_SCREENSHOTS=ON -DOMNICHOIR_BUILD_QUICK4=${{ github.event.pull_request.number == 15 }}
      - name: Build SkellyChoir renderer
        run: cmake --build build-ui --target OmniChoirScreenshots --parallel 2
      - name: Build Quick4 renderer for its initial migration audit
        if: ${{ github.event.pull_request.number == 15 }}
        run: cmake --build build-ui --target SkellyChoirQuick4 --parallel 2
      - name: Test screenshot integrity verifier
        run: python -m unittest discover -s tests -p test_ui_screenshots.py -v
      - name: Verify room scenes, themes, selected preset and key/scale editor controls
        run: |
          set -euo pipefail
          runner=$(find build-ui -type f -name OmniChoirScreenshots -executable | head -n 1)
          test -n "$runner"
          xvfb-run -a -s '-screen 0 1920x1080x24' "$runner" ui-tour-screenshots
          # The RC2 renderer emits 35 real editor captures across modes, tabs,
          # tour/curtain, responsive sizes, themes, rooms, preset and key/scale.
          actual=$(find ui-tour-screenshots -type f -name '*.png' | wc -l)
          test "$actual" -eq 35 || { echo "::error::Expected 35 screenshots, got $actual"; exit 1; }
          test "$(find ui-tour-screenshots -type f -name '15-scene-*.png' | wc -l)" -eq 15
          test "$(find ui-tour-screenshots -type f -name '14-theme-*.png' | wc -l)" -eq 3
          for required in 00a-curtain-closed.png 00b-curtain-parting.png \
              01-first-run-tour.png 02-easy-mode.png 03-pro-main.png \
              05-room.png 12-smallest-window.png 13-large-window.png \
              14-theme-neon-green.png 15-scene-14-stairwell.png \
              16-selected-preset.png 17-key-scale-selected.png; do
            test -s "ui-tour-screenshots/$required" || { echo "::error::Missing or empty $required"; exit 1; }
          done
          echo "Verified all $actual real editor PNG captures"
      - name: Run the four-scene Quick4 renderer (initial migration audit only)
        if: ${{ github.event.pull_request.number == 15 }}
        run: |
          set -euo pipefail
          runner=$(find build-ui -type f -name SkellyChoirQuick4 -executable | head -n 1)
          test -n "$runner"
          xvfb-run -a -s '-screen 0 1920x1200x24' bash -euo pipefail -c '
            openbox --sm-disable >/tmp/skellychoir-openbox.log 2>&1 &
            wm_pid=$!
            trap "kill $wm_pid 2>/dev/null || true" EXIT
            for attempt in $(seq 1 30); do
              if xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -q "window id"; then
                break
              fi
              sleep 0.1
            done
            "$1" --output quick4-local
          ' _ "$runner"
          python scripts/verify_quick4.py --directory quick4-local --manifest quick4-local/manifest.json
      - name: Verify every PNG and write screenshot provenance
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        run: |
          python scripts/verify_ui_screenshots.py \
            --directory ui-tour-screenshots \
            --manifest ui-tour-screenshots/ui-screenshot-manifest.json \
            --source-commit "$SOURCE_COMMIT" \
            --ci-commit "$CI_COMMIT" \
            --run-id "$RUN_ID" \
            --event "$EVENT_NAME" \
            --ref "$REF_NAME"
      - name: Package exact pinned JUCE and SkellCore sources for local Quick4 compilation
        if: ${{ github.event.pull_request.number == 15 }}
        run: |
          set -euo pipefail
          test -f build-ui/_deps/juce-src/CMakeLists.txt
          test -f build-ui/_deps/skellcoreshared-src/SkellCore/CMakeLists.txt
          tar --exclude=.git -czf SkellyChoir-Quick4-pinned-dependencies.tar.gz -C build-ui/_deps juce-src skellcoreshared-src
          git archive --format=tar.gz --prefix=SkellyChoir/ HEAD > SkellyChoir-Quick4-plugin-source.tar.gz
      - uses: actions/upload-artifact@v6
        if: ${{ github.event.pull_request.number == 15 }}
        with:
          name: SkellyChoir-Quick4-pinned-dependencies
          path: |
            SkellyChoir-Quick4-pinned-dependencies.tar.gz
            SkellyChoir-Quick4-plugin-source.tar.gz
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: SkellyChoir-UI-Full-RC2-Audit
          path: |
            ui-tour-screenshots/
            quick4-local/
          if-no-files-found: warn
          retention-days: 14
