name: SkellyChoir / compact UI review
on:
  pull_request:
    paths:
      - 'Source/**'
      - 'tools/screenshots.cpp'
      - 'CMakeLists.txt'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/ui-tour.yml'
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tour:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Install real JUCE GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build xvfb xauth pkg-config libasound2-dev libjack-jackd2-dev \
            libfreetype6-dev libfontconfig1-dev libx11-dev libxext-dev \
            libxinerama-dev libxcursor-dev libxrandr-dev libxcomposite-dev \
            libxrender-dev libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libgtk-3-dev
      - name: Configure SkellyChoir UI
        run: cmake -S . -B build-ui -G Ninja -DCMAKE_BUILD_TYPE=Release -DOMNICHOIR_BUILD_SCREENSHOTS=ON
      - name: Build SkellyChoir renderer
        run: cmake --build build-ui --target OmniChoirScreenshots --parallel 2
      - name: Verify room scenes, themes, selected preset and key/scale editor controls
        run: |
          set -euo pipefail
          runner=$(find build-ui -type f -name OmniChoirScreenshots -executable | head -n 1)
          test -n "$runner"
          xvfb-run -a -s '-screen 0 1920x1080x24' "$runner" ui-tour-screenshots
          # The RC2 renderer emits 35 real editor captures across modes, tabs,
          # tour/curtain, responsive sizes, themes, rooms, preset and key/scale.
          actual=$(find ui-tour-screenshots -type f -name '*.png' | wc -l)
          test "$actual" -eq 35 || { echo "::error::Expected 35 screenshots, got $actual"; exit 1; }
          test "$(find ui-tour-screenshots -type f -name '15-scene-*.png' | wc -l)" -eq 15
          test "$(find ui-tour-screenshots -type f -name '14-theme-*.png' | wc -l)" -eq 3
          for required in 00a-curtain-closed.png 00b-curtain-parting.png \
              01-first-run-tour.png 02-easy-mode.png 03-pro-main.png \
              05-room.png 12-smallest-window.png 13-large-window.png \
              14-theme-neon-green.png 15-scene-14-stairwell.png \
              16-selected-preset.png 17-key-scale-selected.png; do
            test -s "ui-tour-screenshots/$required" || { echo "::error::Missing or empty $required"; exit 1; }
          done
          echo "Verified all $actual real editor PNG captures"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: SkellyChoir-UI-Full-RC2-Audit
          path: ui-tour-screenshots/
          if-no-files-found: warn
          retention-days: 14
