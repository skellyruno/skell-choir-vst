name: OmniChoir / real shared GuidedTour UI screenshots
on:
  pull_request:
    paths:
      - 'Source/**'
      - 'tools/screenshots.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/ui-tour.yml'
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  tour:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install real JUCE GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build xvfb xauth pkg-config libasound2-dev libjack-jackd2-dev \
            libfreetype6-dev libfontconfig1-dev libx11-dev libxext-dev \
            libxinerama-dev libxcursor-dev libxrandr-dev libxcomposite-dev \
            libxrender-dev libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libgtk-3-dev
      - name: Configure original OmniChoir editor and shared tour
        run: cmake -S . -B build-ui -G Ninja -DCMAKE_BUILD_TYPE=Release -DOMNICHOIR_BUILD_SCREENSHOTS=ON
      - name: Build original processor and screenshots tool
        run: cmake --build build-ui --target OmniChoirScreenshots --parallel 2
      - name: Verify first-run overlay and thirteen real editor captures
        run: |
          set -euo pipefail
          runner=$(find build-ui -type f -name OmniChoirScreenshots -executable | head -n 1)
          test -n "$runner"
          xvfb-run -a -s '-screen 0 1920x1080x24' "$runner" ui-tour-screenshots
          test "$(find ui-tour-screenshots -name '*.png' | wc -l)" -eq 13
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OmniChoir-Shared-GuidedTour-Real-JUCE
          path: ui-tour-screenshots/
          if-no-files-found: warn
          retention-days: 14
